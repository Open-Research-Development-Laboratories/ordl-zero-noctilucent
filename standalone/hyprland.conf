# Optional color-only include for Hyprland configurations accepting .conf syntax.
# No keybindings, exec directives, monitors, or security settings.
general {
    col.active_border = rgb(c89d7c) rgb(a9c3c1) 35deg
    col.inactive_border = rgb(303a3e)
}
group {
    col.border_active = rgb(c89d7c)
    col.border_inactive = rgb(303a3e)
}
